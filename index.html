<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Love Heart</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin:0; width:100%; height:100%; background:#060208; overflow:hidden; }
  body { display:flex; align-items:center; justify-content:center; }
  canvas { display:block; width:min(100vw, 100vh); height:min(100vw, 100vh); background:#060208; }
</style>
</head>
<body>
<canvas id="love" width="800" height="800" aria-label="Animated heart made from loving messages"></canvas>
<script>
(() => {
  const canvas = document.getElementById('love');
  const ctx = canvas.getContext('2d');
  const W=800, H=800, SC=21, OY=20, DURATION=10000, TICK=16;
  const ANIM=42, LIFT=34, GAP=7, SIZES=[9,10,11,12], FONT='Arial';
  const BG='#060208';
  const PHRASES=['I love you','HAPPY BIRTHDAY','Didintle','Mashaba',"Ma'babes",'Lava'];
  const FLASH=[1,.78,.78];
  const BGC=[6/255,2/255,8/255];
  const clamp=v=>Math.max(0,Math.min(1,v));
  const mix=(a,b,k)=>a.map((v,i)=>v+(b[i]-v)*k);
  const dim=(c,k)=>c.map(v=>v*k);
  const hx=c=>'#'+c.map(v=>Math.round(Math.max(0,Math.min(1,v))*255).toString(16).padStart(2,'0')).join('');
  const sin=Math.sin, cos=Math.cos, PI=Math.PI;
  function heart(a) {
    return [16*(sin(a)**3)*SC, (13*cos(a)-5*cos(2*a)-2*cos(3*a)-cos(4*a))*SC+OY];
  }
  const poly=Array.from({length:720},(_,i)=>heart(2*PI*i/720));
  const edges=poly.map((p,i)=>[p,poly[(i+1)%poly.length]]);
  const ys=poly.map(p=>p[1]), YMAX=Math.max(...ys), YMIN=Math.min(...ys), CY=(YMAX+YMIN)/2;
  function spans(y) {
    const xs=[];
    for(const [[x1,y1],[x2,y2]] of edges) {
      if((y1<=y && y<y2)||(y2<=y && y<y1)) xs.push(x1+(y-y1)*(x2-x1)/(y2-y1));
    }
    xs.sort((a,b)=>a-b);
    const out=[];
    for(let i=0;i<xs.length;i+=2) if(xs[i+1]!==undefined) out.push([xs[i],xs[i+1]]);
    return out;
  }
  function intersect(A,B) {
    const out=[];
    for(const a of A) for(const b of B) {
      const lo=Math.max(a[0],b[0]), hi=Math.min(a[1],b[1]);
      if(hi-lo>14) out.push([lo,hi]);
    }
    return out;
  }
  // Seeded random generator for a repeatable arrangement.
  let seed=11;
  function rand() { seed|=0; seed=seed+0x6D2B79F5|0; let z=Math.imul(seed^seed>>>15,1|seed); z=z+Math.imul(z^z>>>7,61|z)^z; return ((z^z>>>14)>>>0)/4294967296; }
  const choice=a=>a[Math.floor(rand()*a.length)];
  function shuffle(a) { for(let i=a.length-1;i>0;i--){const j=Math.floor(rand()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
  function measure(text,size) { ctx.font=`bold ${size}px ${FONT}`; return ctx.measureText(text).width; }
  function phraseCycle() {
    let order=[], index=0;
    return () => { if(index>=order.length){order=shuffle(PHRASES.slice());index=0;} return order[index++]; };
  }
  function mathDist(x,y) { return Math.hypot(x/(16*SC),(y-CY)/(14.5*SC)); }
  function build() {
    const next=phraseCycle(), rowH= Math.max(...SIZES.map(z=>z*1.18))+4, half=rowH/2, placed=[];
    for(let y=YMAX-half;y>YMIN+half;y-=rowH) {
      const row=intersect(spans(y+half),spans(y-half));
      for(let [lo0,hi0] of row) {
        const lo=lo0+4, hi=hi0-4;
        let cur=lo+rand()*8, line=[];
        while(true) {
          let fit=null;
          for(let k=0;k<10;k++) {
            const text=next(), size=choice(SIZES), w=measure(text,size);
            if(cur+w<=hi){fit={text,size,w};break;}
          }
          if(!fit) break;
          line.push([cur+fit.w/2,fit.text,fit.size,fit.w]);
          cur+=fit.w+GAP;
        }
        if(!line.length) continue;
        if(line.length>1) {
          const left=hi-(line[line.length-1][0]+line[line.length-1][3]/2);
          line.forEach((it,i)=>it[0]+=left*i/(line.length-1));
        } else line[0][0]=(lo+hi)/2;
        line.forEach((it,i)=>placed.push({x:it[0],y,text:it[1],size:it[2],edge:i===0||i===line.length-1}));
      }
    }
    const wine=[.58,0,.09], crimson=[.90,.05,.14], blood=[.98,.10,.16];
    for(const p of placed) {
      p.rad=Math.min(1,mathDist(p.x,p.y));
      let base=mix(wine,crimson,.25+.75*p.rad);
      base=mix(base,blood,rand()*.35+(p.edge?.3:0));
      p.color=base.map(v=>Math.min(1,v));
    }
    const edge=placed.filter(p=>p.edge), inner=placed.filter(p=>!p.edge);
    edge.sort((a,b)=>(Math.atan2(a.x,a.y-CY)%(2*PI)+2*PI)%(2*PI)-(Math.atan2(b.x,b.y-CY)%(2*PI)+2*PI)%(2*PI));
    inner.sort((a,b)=>-a.rad+rand()*.08-(-b.rad+rand()*.08));
    return edge.concat(inner);
  }
  const order=build();
  const active=[], mainIds=[];
  let cursor=0, start=null, finished=false;
  const RATE=order.length/(DURATION/TICK);
  let acc=0;
  function drawText(text,x,y,size,color) {
    ctx.font=`bold ${size}px ${FONT}`;
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillStyle=color; ctx.fillText(text,x,y);
  }
  function spawn(p) {
    p.f=0; p.dx=(rand()*20)-10;
    active.push(p); mainIds.push(p);
  }
  function animate(p) {
    p.f++;
    const u=clamp(p.f/ANIM), e=1-Math.pow(1-u,3), c=p.color;
    const x=400+p.x, y=400-p.y, hover=(1-e)*LIFT, px=x+p.dx*(1-e), py=y-hover;
    drawText(p.text,px+2,py+3,p.size,BG);
    drawText(p.text,px,py,p.size+1,hx(mix(BGC,dim(c,.20),e*e)));
    const flash=.75*Math.sin(PI*clamp((u-.55)/.45));
    const col=mix(mix(BGC,c,Math.pow(e,1.5)),FLASH,flash);
    drawText(p.text,px,py,p.size,hx(col));
    if(u>=1) { p.done=true; return false; }
    return true;
  }
  function renderFinal() {
    ctx.clearRect(0,0,W,H);
    for(const p of order) {
      const x=400+p.x, y=400-p.y;
      drawText(p.text,x+2,y+3,p.size,BG);
      drawText(p.text,x,y,p.size,hx(p.color));
    }
  }
  function frame(ts) {
    if(start===null) start=ts;
    ctx.fillStyle=BG; ctx.fillRect(0,0,W,H);
    if(!finished) {
      acc+=RATE;
      while(acc>=1 && cursor<order.length){acc--;spawn(order[cursor++]);}
      let keep=[];
      for(const p of active) if(animate(p)) keep.push(p);
      active.length=0; active.push(...keep);
      if(cursor>=order.length && active.length===0) finished=true;
    } else {
      // Keep the finished heart visible and softly shimmer selected words.
      renderFinal();
      const p=choice(mainIds);
      const x=400+p.x,y=400-p.y;
      drawText(p.text,x,y,p.size,hx(mix(p.color,FLASH,.6)));
      setTimeout(()=>{},0);
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
